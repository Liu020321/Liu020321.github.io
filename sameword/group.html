if(d.type==='hello'){if(connections.has(id))return;const kind=d.mode==='spectator'?'spectator':'player';if(phase!=='lobby'&&kind==='player'){send(c,{type:'reject',reason:'游戏已经开始，当前只能观战。'});setTimeout(()=>c.close(),300);return}if(kind==='player'&&players.length>=8){send(c,{type:'reject',reason:'群战房间已满：最多 8 名参赛者。可以选择观战。'});setTimeout(()=>c.close(),300);return}connections.set(id,c);if(kind==='player')players.push({id,name:clean(d.name)||'玩家'});else spectators.push(id);broadcast()}

if(d.type==='answer'&&phase==='entry'&&players.some(p=>p.id===id)&&!submissions[id]){const word=clean(d.word);if(word){submissions[id]=word;resolve();broadcast()}}
if(d.type==='leave'){c.close();remove(id)}
});c.on('close',()=>{if(connections.has(id)&&!closed)remove(id)});c.on('error',()=>{if(connections.has(id)&&!closed)remove(id)})}
function resolve(){if(phase!=='entry'||players.length<2||!players.every(p=>submissions[p.id]))return;const answers=players.map(p=>({name:p.name,word:submissions[p.id]}));const same=answers.every(a=>normalize(a.word)===normalize(answers[0].word));records.push({round,answers,same});phase=same?'won':round>=25?'limit':'reveal';submissions={};if(phase==='won'||phase==='limit')broadcast()}
function openRoom(){show('home',false);show('room',true);show('ended',false);$('roomcode').textContent=code;history.replaceState(null,'',location.pathname+'?room='+code+(mode==='spectator'?'&watch=1':''))}
async function create(){try{await loadPeer()}catch(e){alert(e.message);return}host=true;mode='host';nick=clean($('name').value)||'房主';code=randomCode();peer=new Peer(roomId(code));peer.on('open',()=>{players=[{id:'host',name:nick}];openRoom();broadcast()});peer.on('connection',accept);peer.on('error',e=>{if(!closed)finish('连接失败',peerErrorText(e),false)})}
async function join(kind){if(joining||peer&&!peer.destroyed)return;joining=true;$('join').disabled=true;$('watch').disabled=true;code=clean($('code').value).toUpperCase();if(!/^[A-Z2-9]{6}$/.test(code)){joining=false;$('join').disabled=false;$('watch').disabled=false;return alert('请输入六位房间号')}mode=kind;nick=clean($('name').value)||(kind==='spectator'?'观战者':'玩家');try{await loadPeer()}catch(e){joining=false;$('join').disabled=false;$('watch').disabled=false;alert(e.message);return}peer=new Peer();peer.on('open',()=>{socket=peer.connect(roomId(code),{reliable:true});socket.on('open',()=>{seenHost=true;joining=false;send(socket,{type:'hello',name:nick,mode:kind});openRoom()});socket.on('data',d=>{if(d.type==='state'){phase=d.phase;round=d.round;players=d.players;spectators=[];records=d.records;render(d)}if(d.type==='closed')finish(d.title||'房间已解散',d.why||'房主已离开。',false);if(d.type==='reject')finish('无法加入',d.reason,false)});socket.on('close',()=>{if(!closed)finish('房间已解散','房主已退出或连接中断，所有人已退出本房间。',false)});socket.on('error',e=>{if(!closed)finish('连接失败',peerErrorText(e),false)});setTimeout(()=>{if(!seenHost&&!closed)finish('连接超时','找不到房主，请确认房间号和房主是否在线。',false)},11000)});peer.on('error',e=>{if(!closed)finish('连接失败',peerErrorText(e),false)})}
function render(d){if(closed)return;const members=d.players||players;const spect=d.spectatorCount??spectators.length;const myId=host?'host':peer?.id;const mine=members.find(p=>p.id===myId);const spectator=!host&&!mine;
$('role').textContent=host?'房主':spectator?'观战者':'参赛玩家';
$('phaseTitle').textContent=({lobby:'备战大厅',entry:'第 '+round+'/25 轮 · 正在作答',reveal:'第 '+round+'/25 轮 · 答案揭晓',won:'🎉 全员同频成功',limit:'25 轮已结束'})[phase];
$('count').textContent=members.length+'/8 人参赛 · '+spect+' 人观战';
const memberKey=members.map(p=>p.id+'|'+p.name+'|'+p.done).join(';')+'|'+phase;if(memberKey!==render._membersKey){render._membersKey=memberKey;$('members').replaceChildren();members.forEach(p=>{const e=document.createElement('div');e.className='member';const n=document.createElement('span');n.textContent=(p.id==='host'?'👑 ':'💫 ')+p.name;const t=document.createElement('span');t.textContent=phase==='entry'?(p.done?'已提交':'思考中'):'已加入';e.append(n,t);$('members').append(e)})}
message(d.message||'');
show('start',host&&phase==='lobby');$('start').disabled=members.length<2;
show('entry',phase==='entry'&&!spectator&&!locked);show('action',host&&phase==='reveal');
if(phase==='entry'&&mine?.done){locked=true;show('entry',false);message('已锁定答案，等待其他玩家提交。')}
if(phase!=='entry')locked=false;
if(spectator&&phase==='entry')message('观战中：本轮答案尚未揭晓。');
const histKey=JSON.stringify(d.records||[]);if(histKey!==render._histKey){render._histKey=histKey;$('history').replaceChildren();(d.records||[]).forEach(r=>{const box=document.createElement('div');box.className='round';const h=document.createElement('div');h.className='muted';h.textContent='第 '+r.round+' 轮'+(r.same?' · 全员同频 ✨':'');box.append(h);const grid=document.createElement('div');grid.className='wordline';r.answers.forEach(a=>{const item=document.createElement('div');item.className='word';item.textContent=a.name+' · '+a.word;grid.append(item)});box.append(grid);$('history').append(box)})}
if(phase==='won'||phase==='limit'){show('entry',false);show('action',false);message(phase==='won'?'💗 所有人写出了同一个词，默契达成！':'已达到 25 轮上限，本场群战强制结束。');}
}
function begin(){if(!host||players.length<2||phase!=='lobby')return;phase='entry';round=1;broadcast()}
function next(){if(!host||phase!=='reveal')return;round++;phase='entry';submissions={};broadcast()}
function submit(){if(locked||phase!=='entry')return;const word=clean($('word').value);if(!word)return alert('请输入词语');locked=true;$('word').value='';if(host){submissions.host=word;resolve();broadcast()}else send(socket,{type:'answer',word});render(snapshot())}
function copyLink(watch){const url=new URL(location.href);url.searchParams.set('room',code);if(watch)url.searchParams.set('watch','1');else url.searchParams.delete('watch');navigator.clipboard?.writeText(url.toString()).then(()=>alert('链接已复制')).catch(()=>prompt('复制链接',url.toString()))}
$('create').onclick=create;$('join').onclick=()=>join('player');$('watch').onclick=()=>join('spectator');$('start').onclick=begin;$('next').onclick=next;$('submit').onclick=submit;$('invite').onclick=()=>copyLink(false);$('sharewatch').onclick=()=>copyLink(true);$('exit').onclick=exit;$('back').onclick=()=>location.href=location.pathname;
window.addEventListener('beforeunload',()=>{if(host&&!closed)all({type:'closed',title:'房间已解散',why:'房主离开，房间解散。'})});
const params=new URLSearchParams(location.search);if(params.get('room')){$('code').value=params.get('room').toUpperCase();if(params.has('watch')){document.querySelector('#watch').style.outline='2px solid #ffb9db'}}
})();
</script></body></html>
