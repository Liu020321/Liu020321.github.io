<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同词相遇 · 同屏版</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 0 0,#4c2c60,transparent 55%),radial-gradient(circle at 100% 100%,#272d59,transparent 55%),#130e24;color:white;font-family:system-ui,'Microsoft YaHei',sans-serif;display:grid;place-items:center}.box{width:min(94%,460px);padding:30px;background:#ffffff10;border:1px solid #ffffff2a;border-radius:25px;text-align:center}h1{font-size:40px;background:linear-gradient(90deg,#ffc6dd,#bbb3ff);color:transparent;background-clip:text}p{color:#c9c2d9;line-height:1.8}input,button{width:100%;border:0;border-radius:14px;padding:15px;margin:9px 0;font-size:17px}input{background:#141024;color:#fff;border:1px solid #ffffff50}button{background:linear-gradient(90deg,#ffc0d9,#bba8ff);font-weight:bold;color:#29152d;cursor:pointer}button:disabled{opacity:.5}.chip{display:inline-block;background:#ffffff20;padding:10px 14px;border-radius:12px;margin:5px}.tiny{font-size:13px;color:#b2a7ce}.hidden{display:none}</style><div class="box"><div style="font-size:32px">🌙 ✨ 💞</div><h1>同词相遇</h1><p>双人同屏 · 轮流输入 · 同时揭晓</p><div id="start"><button onclick="start()">开始游戏 💗</button></div><div id="game" class="hidden"><p id="round"></p><div id="prev"></div><p id="guide"></p><input id="word" maxlength="24" placeholder="想到的词语…" autocomplete="off"><button id="send" onclick="submit()">锁定答案 🔮</button><p class="tiny">另一位玩家请暂时移开视线</p></div><div id="reveal" class="hidden"><h2 id="result"></h2><p id="detail"></p><button id="continue" onclick="advance()">继续 →</button></div><div id="hist" class="tiny"></div><p class="tiny"><a href="./" style="color:#dab9ff">返回联机版</a></p></div><script>let r=1,stage=0,words=[],records=[],won=false;const $=x=>document.getElementById(x);function start(){r=1;records=[];stage=0;words=[];show()}function show(){$('start').classList.add('hidden');$('reveal').classList.add('hidden');$('game').classList.remove('hidden');$('round').textContent='ROUND '+String(r).padStart(2,'0');$('guide').textContent=stage===0?'玩家一，请输入你的词语':'玩家二，请输入你的词语';$('prev').replaceChildren();if(r>1){let v=records.at(-1);[v[0],v[1]].forEach(w=>{let e=document.createElement('span');e.className='chip';e.textContent=w;$('prev').append(e)})}$('word').value='';$('word').focus()}function submit(){let v=$('word').value.trim();if(!v)return alert('请输入一个词语');words.push(v);if(stage===0){stage=1;show()}else{records.push(words);won=words[0].normalize('NFKC').toLowerCase().replace(/\s/g,'')===words[1].normalize('NFKC').toLowerCase().replace(/\s/g,'');$('game').classList.add('hidden');$('reveal').classList.remove('hidden');$('result').textContent=won?'🎉 同频成功！':'还没撞词，继续联想！';$('detail').textContent=words[0]+' × '+words[1];$('continue').textContent=won?'再玩一次 ✨':'下一轮 →';$('hist').textContent=records.map((v,i)=>'第'+(i+1)+'轮 '+v.join(' × ')).join('　|　')}}function advance(){if(won){start();return}r++;stage=0;words=[];show()}$('word').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)submit()})</script></html>
